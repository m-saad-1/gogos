<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Banging Burgers</title>
    <link rel="icon" type="image/avif" href="../assets/images/logo.avif">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/loader.js"></script>
</head>
<body>

<main>
        <section class="orders-page" style="padding: 2.5rem 0; background-color: var(--clr-background); min-height: 70vh;">
            <div class="container">
                <div class="section-header" style="text-align: left; margin-bottom: 2rem;">
                    <h2>My Orders</h2>
                </div>
                
                <div style="max-width: 800px; margin: 0 auto;">
                    
                    <!-- Empty State (Hidden by default) -->
                    <div class="empty-orders-state" style="display: none; text-align: center; padding: 4rem 2rem; background: white; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 2rem;">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1.5rem;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <h3 style="font-size: 1.5rem; color: var(--clr-text-primary); margin-bottom: 0.5rem;">No orders found</h3>
                        <p style="color: #666; margin-bottom: 2rem;">You haven\'t placed any orders yet.</p>
                        <a href="menu.html" class="btn btn-primary" style="padding: 0.8rem 2rem; border-radius: 50px; text-decoration: none;">Place an Order</a>
                    </div>

                    <!-- Active Order -->
                    <div class="order-card active-order">
                        <div class="order-header">
                            <div>
                                <span class="order-status">PREPARING</span>
                                <h3 class="order-id">Order #4092</h3>
                                <span class="order-time">Today, 19:42</span>
                            </div>
                            <div style="text-align: right;">
                                <span class="order-price">Rs 2318</span>
                            </div>
                        </div>
                        <p class="order-items">1x King Deal 1<br>1x Supreme Pizza</p>
                        
                        <div class="order-progress-box">
                            <strong class="order-progress-title">Estimated Delivery: 20:15 - 20:30</strong>
                            <div class="order-progress-bar">
                                <div class="order-progress-fill"></div>
                            </div>
                            <div class="order-progress-steps">
                                <span>Confirmed</span>
                                <span class="active">Preparing</span>
                                <span>Out for Delivery</span>
                            </div>
                        </div>
                    </div>
                    
                    <h3 style="margin-bottom: 1.5rem; color: #444;">Order History</h3>
                    
                    <!-- Past Order -->
                    <div class="order-card">
                        <div class="order-header" style="border: none; padding-bottom: 0; margin-bottom: 0;">
                            <div>
                                <span class="order-status delivered">DELIVERED</span>
                                <h3 class="order-id">Order #3911</h3>
                                <span class="order-time">01/08/2026</span>
                            </div>
                            <div style="text-align: right;">
                                <span class="order-price">Rs 1399</span>
                                <button class="btn btn-outline" style="border-radius: 50px;">Reorder</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="../assets/js/script.js" defer></script>
</body>
</html>
