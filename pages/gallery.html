<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Banging Burgers</title>
    <link rel="icon" type="image/png" href="../assets/images/logo.avif">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- Component Loader -->
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/loader.js"></script>
</head>
<body>
    <!-- Navbar injected by loader.js -->

    <main>
        <section class="gallery-section" style="padding: 2.5rem 0; background-color: var(--clr-background); min-height: 70vh;">
            <div class="container">
                <div class="section-header" style="margin-bottom: 2.5rem;">
                    <h2>Our Gallery</h2>
                    <p style="color: #666; font-size: 1.05rem;">Discover our space and see our most ordered dishes.</p>
                </div>
                
                <div class="gallery-grid">
                    <div class="gallery-item"><video preload="metadata" class="lightbox-trigger" muted loop playsinline style="width: 100%; border-radius: var(--border-radius);"><source data-src="../assets/gallery/gallery (1).mp4" type="video/mp4"></video></div>
                    <div class="gallery-item"><video preload="metadata" class="lightbox-trigger" muted loop playsinline style="width: 100%; border-radius: var(--border-radius);"><source data-src="../assets/gallery/gallery (2).mp4" type="video/mp4"></video></div>
                    <div class="gallery-item"><video preload="metadata" class="lightbox-trigger" muted loop playsinline style="width: 100%; border-radius: var(--border-radius);"><source data-src="../assets/gallery/gallery (3).mp4" type="video/mp4"></video></div>
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery (1).jpg" alt="Gallery Image" class="lightbox-trigger"></div>
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery (2).jpg" alt="Gallery Image" class="lightbox-trigger"></div>
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery (3).jpg" alt="Gallery Image" class="lightbox-trigger"></div>
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery (4).jpg" alt="Gallery Image" class="lightbox-trigger"></div>
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery (5).jpg" alt="Gallery Image" class="lightbox-trigger"></div>
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery (6).jpg" alt="Gallery Image" class="lightbox-trigger"></div>
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery (7).jpg" alt="Gallery Image" class="lightbox-trigger"></div>
                </div>
                <div style="text-align: center; margin-top: 2.5rem; padding: 3rem 2rem; background: rgba(231, 157, 31, 0.05); border-radius: var(--border-radius-lg); border: 1px dashed rgba(231, 157, 31, 0.3);">
                    <h3 style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--clr-text-primary);">Mais Momentos</h3>
                    <p style="color: #666; font-size: 1.1rem; margin-bottom: 2rem;">Acompanhe nosso dia a dia no Instagram!</p>
                    <a href="https://www.instagram.com/bangingburgerscafe" target="_blank" class="btn btn-primary" style="border-radius: 50px; font-weight: 600; padding: 0.8rem 1.5rem; box-shadow: 0 5px 15px rgba(231, 157, 31, 0.3); font-size: 0.9rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; white-space: nowrap; max-width: 100%;"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="css-i6dzq1"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>Siga no Insta</a>
                </div>
            </div>
        </section>
    </main>
    <!-- Footer injected by loader.js -->

    <!-- ===== Menu Item Detail Modal ===== -->
    <div class="modal-overlay" id="item-modal" role="dialog" aria-modal="true" aria-labelledby="modal-item-name">
        <div class="modal-sheet">
            <div class="modal-drag-handle"></div>
            <div class="modal-img-wrap">
                <img id="modal-item-img" src="" alt="" loading="lazy">
            </div>
            <div class="modal-body">
                <span class="modal-category-tag" id="modal-item-category">Category</span>
                <h2 class="modal-item-name" id="modal-item-name">Item Name</h2>
                <p class="modal-item-desc" id="modal-item-desc">Description goes here.</p>
                <div class="modal-price-row">
                    <span class="modal-price" id="modal-item-price">Rs 0</span>
                    <div class="modal-rating">
                        <span>★</span> 4.8 &nbsp;(120+)
                    </div>
                </div>
                <!-- Add-ons -->
                <div id="modal-addons-wrap">
                    <p class="modal-addons-title">Add-ons</p>
                    <div class="addon-options" id="modal-addon-options">
                        <!-- Chips injected by JS -->
                    </div>
                </div>
                <!-- Qty + Cart -->
                <div class="modal-footer">
                    <div class="modal-qty-stepper">
                        <button class="modal-qty-btn" id="modal-qty-minus" aria-label="Decrease quantity">−</button>
                        <span class="modal-qty-val" id="modal-qty-val">1</span>
                        <button class="modal-qty-btn" id="modal-qty-plus" aria-label="Increase quantity">+</button>
                    </div>
                    <button class="btn btn-primary modal-add-btn" id="modal-add-to-cart">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        Add to Cart — <span id="modal-add-total">Rs 0</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    </div>
    <script src="../assets/js/script.js" defer></script>
                <button class="chatbot-close">&times;</button>
            </div>
            <div class="chatbot-messages">
                <div class="chat-message bot">
                    <div class="msg-content">Hello! Welcome to Banging Burgers. How can I help you today?</div>
                </div>
            </div>
            <div class="chatbot-input">
                <input type="text" placeholder="Type your message..." id="chat-input-field">
                <button id="chat-send-btn" aria-label="Send">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
